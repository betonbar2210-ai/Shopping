<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}База{% endblock title %}</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.0/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-light">
    <div class="container-fluid h-100 p-0">
        <div class="row m-0 h-100">
            <!-- Сайдбар -->
            <div class="col-md-2 bg-dark text-white p-0 sidebar-wrapper">
                <div class="sidebar-content d-flex flex-column h-100">
                    <div class="p-3">
                        <a href="{% url 'catalog:index' %}" class="d-flex align-items-center mb-3 text-white text-decoration-none">
                            <img src="{% static 'images/logo.jpg' %}" alt="" width="32" height="32" class="rounded-circle me-2">
                            <span class="fs-4 fw-bold">SkyproStore</span>
                        </a>
                        <hr class="bg-white my-2">

                        <ul class="nav nav-pills flex-column mb-auto">
                        
                            <li class="nav-item">
                                <a href="{% url 'catalog:index' %}" 
                                   class="nav-link text-white {% if request.resolver_match.url_name == 'index' %}active{% endif %}">
                                    <i class="bi bi-house me-2"></i>Главная
                                </a>
                            </li>

                            <li>
                                <a href="#" class="nav-link text-white">
                                    <i class="bi bi-tag me-2"></i>Категории
                                </a>
                            </li>

                            <li class="nav-item">
                                <a href="#" class="nav-link text-white">
                                    <i class="bi bi-tag me-2"></i>Каталог
                                </a>
                            </li>

                            <li>
                                <a href="#" class="nav-link text-white">
                                    <i class="bi bi-cart me-2"></i>Заказы
                                </a>
                            </li>

                            <li>
                                <a href="{% url 'catalog:contacts' %}" 
                                   class="nav-link text-white {% if request.resolver_match.url_name == 'contacts' %}active{% endif %}">
                                    <i class="bi bi-phone me-2"></i>Контакты
                                </a>
                            </li>
                        </ul>

                        <hr class="bg-white my-2">
                    </div>

                    {% include "catalog/includes/inc_foot.html" %}

                </div>
            </div>

            <main class="col-md-10 p-0">
                {% block content %}{% endblock content %}
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
