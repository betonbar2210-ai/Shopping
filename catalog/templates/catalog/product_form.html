{% extends 'catalog/basa.html' %}
{% load static %}
{% block title %}Создание Товара{%endblock title %}
<main class="col-md-10 p-0">
    {% block content %}
        <div class="container">
            <div class="row">
                <div class="col-md-12">
                    <h1>Создание Товара</h1>
                        <form method="post" enctype="multipart/form-data">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <button type="submit" class="btn btn-primary">
                                {% if object %}
                                Сохранить
                                {% else %}
                                Создать
                                {% endif %}
                            </button>
                        </form>
                </div>
            </div>
        </div>
    {% endblock content %}
</main>
